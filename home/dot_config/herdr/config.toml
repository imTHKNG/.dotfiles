onboarding = false

[keys]
split_vertical = ["prefix+v", "prefix+|"]
detach = ["prefix+q", "prefix+d"]
workspace_picker = ["prefix+w", "prefix+s"]
settings = "prefix+;"
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"
focus_pane_left = ["prefix+h", "ctrl+h"]
focus_pane_down = ["prefix+j", "ctrl+j"]
focus_pane_up = ["prefix+k", "ctrl+k"]
focus_pane_right = ["prefix+l", "ctrl+l"]
navigate_workspace_down = "j"
navigate_workspace_up = "k"
navigate_pane_down = "down"
navigate_pane_up = "up"

[ui]
prompt_new_tab_name = false
tab_bar_position = "bottom"

[ui.toast]
delivery = "system"

[ui.sound]
enabled = false

[theme]
name = "catppuccin"
auto_switch = true
light_name = "catppuccin-latte"
dark_name = "catppuccin"
