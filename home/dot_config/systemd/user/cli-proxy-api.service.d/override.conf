[Unit]
Description=Local Claude Pro proxy for Pi

[Service]
ExecStart=
ExecStart=/usr/bin/cli-proxy-api --config %h/.local/share/cliproxyapi-opus-test/config.native.yaml
WorkingDirectory=%h/.local/share/cliproxyapi-opus-test
Restart=on-failure
RestartSec=5s
TimeoutStopSec=30s
UMask=0077

# Hide the rest of the home directory, including unrelated credentials.
PrivateUsers=yes
NoNewPrivileges=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectSystem=strict
ProtectHome=tmpfs
BindReadOnlyPaths=%h/.local/share/cliproxyapi-opus-test/config.native.yaml
BindPaths=%h/.local/share/cliproxyapi-opus-test/auth-native
ReadWritePaths=%h/.local/share/cliproxyapi-opus-test/auth-native
TemporaryFileSystem=%h/.local/share/cliproxyapi-opus-test/logs:rw,nosuid,nodev,noexec,size=64M
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
