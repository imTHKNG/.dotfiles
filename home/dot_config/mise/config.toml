"npm:effect-solutions" = "0.5.3"
tree-sitter = "0.27.1"
"npm:@effect/language-service" = "0.87.5"
rust = { version = "1.99.1", components = ["rust-analyzer"] }
"npm:@steipete/summarize" = "0.25.3"
"cargo:lstr" = "0.3.0"
uv = "0.13.5"
"pipx:yt-dlp" = "2026.10.21"
glow = "3.0.0"
"npm:@openai/codex" = "0.164.0"
chezmoi = "2.73.3"
pnpm = "12.15.0"
kubectl = "1.37.1"
kubelogin = "1.36.4"
restic = "0.19.1"
"npm:@kitlangton/ghui" = "0.9.1"
"npm:hunkdiff" = "0.24.0"
fd = "10.5.0"
eza = "0.23.5"
lazygit = "0.66.2"
gh = "2.103.0"
pi = "1.4.0"
fzf = "0.74.5"
jq = "1.8.2"
superfile = "1.6.0"
"npm:mcporter" = "0.16.0"
"github:agavra/tuicr" = "0.27.0"
"aqua:pimalaya/himalaya" = "2.2.1"
workmux = "0.1.276"
"cargo:rustic-rs" = "0.11.4"
gitleaks = "8.30.1"
trufflehog = "3.99.4"
"cargo:rustlings" = "6.5.0"
"cargo:dioxus-cli" = "0.7.10"
"cargo:cargo-clean-all" = "0.6.5"
herdr = "latest"
"npm:cf" = "1.0.0-beta.21"
aws-cli = { version = "2.38.5", symlink_bins = "true" }
"http:herdr-core" = { version = "0.1.16", url = "https://releases.herdr.dev/core/{{ version }}/herdr-core-linux-x86_64.tar.gz", rename_exe = "herdr-core", checksum = "sha256:58d6861176dc6fe905b58880d5bff07a9959be613a98e5d66b4583b04b6cfa45" }

[settings]
minimum_release_age = "7d"
minimum_release_age_excludes = ["pi"]

[settings.npm]
package_manager = "bun"

[env]
XDG_CONFIG_HOME = "/home/knth/.config"
XDG_DATA_HOME = "/home/knth/.local/share"
XDG_CACHE_HOME = "/home/knth/.cache"
XDG_STATE_HOME = "/home/knth/.local/state"
